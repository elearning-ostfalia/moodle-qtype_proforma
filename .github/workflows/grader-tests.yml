name: Grader Tests (Praktomat)

# Behat tests which need an actual grader (tag @grade_proforma).
# They run in a separate workflow so that a failing grader setup does not
# hide the results of the normal Moodle Plugin CI workflow.

on: [push, workflow_dispatch]

jobs:
  grader-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    # Same Moodle versions as in moodle-ci.yml. Each job runs on its own runner
    # and therefore starts its own Praktomat instance.
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            moodle-branch: 'MOODLE_501_STABLE'
            database: 'mariadb'
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
            database: 'pgsql'
          - php: '8.4'
            moodle-branch: 'MOODLE_503_STABLE'
            database: 'pgsql'
          - php: '8.4'
            moodle-branch: 'main'
            database: 'pgsql'

    env:
      PHP_VERSION: ${{ matrix.php }}
      MOODLE_BRANCH: ${{ matrix.moodle-branch }}
      DB: ${{ matrix.database }}

    steps:
      # ---------------------------------------------------------------
      # Praktomat (grader)
      # ---------------------------------------------------------------
      - name: Check out Praktomat
        uses: actions/checkout@v5
        with:
          repository: elearning-ostfalia/Proforma-Praktomat
          path: praktomat

      - name: Configure Praktomat
        working-directory: praktomat
        run: |
          cp .env.example .env
          # The praktomat user inside the container must be member of the host's docker group
          # in order to start the sandbox containers via the docker socket.
          DOCKER_GID=$(getent group docker | cut -d: -f3)
          echo "Docker group id: $DOCKER_GID"
          sed -i "s/^DOCKER_GROUP_ID=.*/DOCKER_GROUP_ID=$DOCKER_GID/" .env
          # GitHub hosted runners have 4 CPU cores.
          sed -i "s/^WORKERS=.*/WORKERS=4/" .env
          # SetlX is not installed automatically (see Praktomat README).
          wget -q https://download.randoom.org/setlX/pc/setlX_v2-7-2.binary_only.zip
          unzip -p setlX_v2-7-2.binary_only.zip setlX.jar > extra/setlX-2.7.jar
          # Publish the grader port to the runner host (Moodle runs directly on the runner).
          cat > docker-compose-ci.yml <<'EOF'
          services:
            praktomat:
              ports:
                - "8010:8010"
          EOF

      - name: Build and start Praktomat
        working-directory: praktomat
        run: |
          docker compose -f docker-compose.yml -f docker-compose-ci.yml build
          docker compose -f docker-compose.yml -f docker-compose-ci.yml up -d

      - name: Make Praktomat reachable as http://praktomat:8010
        run: echo "127.0.0.1 praktomat" | sudo tee -a /etc/hosts

      - name: Wait for Praktomat
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://praktomat:8010/ || true)
            if [ "$code" != "000" ]; then
              echo "Praktomat answers with HTTP $code"
              exit 0
            fi
            echo "waiting for Praktomat ($i)..."
            sleep 10
          done
          echo "Praktomat did not start"
          docker compose -f praktomat/docker-compose.yml logs --tail=200
          exit 1

      # ---------------------------------------------------------------
      # Moodle
      # ---------------------------------------------------------------
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci add-plugin elearning-ostfalia/moodle-qbehaviour_adaptiveexternalgrading
          moodle-plugin-ci add-plugin elearning-ostfalia/moodle-qformat_proforma
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
          # Grading (especially the first test per programming language, which creates
          # the sandbox image) takes much longer than usual Behat steps.
          moodle-plugin-ci add-config '$CFG->behat_increasetimeout = 4;'

      - name: Behat grader features
        run: moodle-plugin-ci behat --profile chrome --tags="@grade_proforma&&~@qtype_proforma_manual"

      - name: Praktomat logs
        if: ${{ failure() }}
        run: docker compose -f praktomat/docker-compose.yml logs --tail=300
